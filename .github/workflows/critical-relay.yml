name: Critical Relay

on:
  push:
    branches: [master]
    paths:
      - "skills/**"
      - "user_rules.md"
      - "vault/README.md"
      - "rules/common/prompt-engineering.md"
      - "scripts/critical-relay/**"
      - "scripts/router/**"
      - "scripts/performance/**"
      - "scripts/devspace-portable/**"
      - "scripts/entry-sync/templates/**"
      - "skills/critical-relay/**"
      - "skills/pixiu-verify-loop/**"
      - "skills/verification-loop/**"
      - ".agents/skills/critical-relay/**"
      - ".agents/skills/pixiu-verify-loop/**"
      - ".agents/skills/verification-loop/**"
      - "vault/bootstrap/**"
      - "vault/capabilities/**"
      - "vault/governance/**"
      - "AGENTS.md"
      - "CODEX.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".codex/AGENTS.md"
      - "commands/go.md"
      - ".gitignore"
      - ".github/workflows/critical-relay.yml"
  pull_request:
    paths:
      - "skills/**"
      - "user_rules.md"
      - "vault/README.md"
      - "rules/common/prompt-engineering.md"
      - "scripts/critical-relay/**"
      - "scripts/router/**"
      - "scripts/performance/**"
      - "scripts/devspace-portable/**"
      - "scripts/entry-sync/templates/**"
      - "skills/critical-relay/**"
      - "skills/pixiu-verify-loop/**"
      - "skills/verification-loop/**"
      - ".agents/skills/critical-relay/**"
      - ".agents/skills/pixiu-verify-loop/**"
      - ".agents/skills/verification-loop/**"
      - "vault/bootstrap/**"
      - "vault/capabilities/**"
      - "vault/governance/**"
      - "AGENTS.md"
      - "CODEX.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".codex/AGENTS.md"
      - "commands/go.md"
      - ".gitignore"
      - ".github/workflows/critical-relay.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run public core with local evidence
        run: node scripts/critical-relay/test-runner.js
      # 即使測試失敗仍保存指定的去敏證據；不把失敗結論改成成功。
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-relay-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cr/runs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
