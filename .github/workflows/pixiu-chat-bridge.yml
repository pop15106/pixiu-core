name: Pixiu Chat Bridge\n\non:\n  push:\n    branches:\n      - master\n    paths:\n      - 'scripts/codex-bridge/pixiu-chat-bridge.js'\n      - 'scripts/codex-bridge/pixiu-chat-bridge.test.js'\n      - 'scripts/codex-bridge/pixiu-chat-probe.js'\n      - 'scripts/codex-bridge/README.md'\n      - '.github/workflows/pixiu-chat-bridge.yml'\n  pull_request:\n    paths:\n      - 'scripts/codex-bridge/pixiu-chat-bridge.js'\n      - 'scripts/codex-bridge/pixiu-chat-bridge.test.js'\n      - 'scripts/codex-bridge/pixiu-chat-probe.js'\n      - 'scripts/codex-bridge/README.md'\n      - '.github/workflows/pixiu-chat-bridge.yml'\n  workflow_dispatch:\n\njobs:\n  synthetic-probe:\n    name: Synthetic round-trip gate\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n\n      - name: Run protocol tests\n        run: node --test scripts/codex-bridge/pixiu-chat-bridge.test.js\n\n      - name: Run synthetic probe\n        run: node scripts/codex-bridge/pixiu-chat-probe.js synthetic --ledger "${{ runner.temp }}/pixiu-chat-bridge-ledger.jsonl"\n